services:
  mcp-proxy:
    image: ghcr.io/tbxark/mcp-proxy:latest
    container_name: mcp-proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.json:/config/config.json:ro
      - ./servers:/servers:ro
      - uv-cache:/root/.cache/uv
      - npm-cache:/root/.npm
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/_healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mcp-net

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      mcp-proxy:
        condition: service_healthy
    networks:
      - mcp-net

volumes:
  caddy-data:
  caddy-config:
  uv-cache:
  npm-cache:

networks:
  mcp-net:
    driver: bridge
