# Docker Compose stack for the MCPX remote MCP gateway.
# Runs the internal mcpx-gateway and mcpx-oauth services alongside Caddy HTTPS.
# Shares the persistent mcpx-logs volume (/var/log/mcpx) across all services
# so Caddy, mcpx-oauth, mcpx-gateway, and local MCP servers write logs together.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mcpx-gateway:
    build: ./gateway
    image: mcpx-gateway:local
    container_name: mcpx-gateway
    restart: unless-stopped
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file:
      - .env
    environment:
      MCPX_LOG_DIR: /var/log/mcpx
    command:
      - --config
      - /config/config.json
    volumes:
      - ./config.json:/config/config.json:ro
      - ./servers:/servers:ro
      - uv-cache:/root/.cache/uv
      - npm-cache:/root/.npm
      - mcpx-logs:/var/log/mcpx
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/_healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mcp-net

  mcpx-oauth:
    image: python:3.13-alpine
    container_name: mcpx-oauth
    restart: unless-stopped
    mem_limit: 96m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file:
      - .env
    environment:
      MCPX_LOG_DIR: /var/log/mcpx
      MCP_OAUTH_DB_PATH: /data/oauth.db
    command:
      - python3
      - /app/server.py
    volumes:
      - ./oauth:/app:ro
      - oauth-data:/data
      - mcpx-logs:/var/log/mcpx
    expose:
      - "9100"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/_healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mcp-net

  caddy:
    image: caddy:2.11.9-alpine
    container_name: caddy
    restart: unless-stopped
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - mcpx-logs:/var/log/mcpx
    depends_on:
      mcpx-gateway:
        condition: service_healthy
      mcpx-oauth:
        condition: service_healthy
    networks:
      - mcp-net

volumes:
  caddy-data:
  caddy-config:
  oauth-data:
  uv-cache:
  npm-cache:
  mcpx-logs:

networks:
  mcp-net:
    driver: bridge
